<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduMax Admin - Add Announcement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="border-bottom">
        <div class="container py-3 d-flex justify-content-between align-items-center">
            <div>
                <span class="fs-4 fw-bold">EduMax</span>
                <span class="ms-2 text-secondary">Admin View</span>
            </div>
            <span>Admin User</span>
        </div>
    </header>

    <div class="container py-4">
        <div class="row">
            <nav class="col-md-3 mb-4" aria-label="Admin navigation">
                <div class="list-group">
                    <a class="list-group-item list-group-item-action" href="#">Dashboard</a>
                    <a class="list-group-item list-group-item-action" href="#">Students</a>
                    <a class="list-group-item list-group-item-action" href="#">Module Catalogue</a>
                    <a class="list-group-item list-group-item-action" href="#">Learning Events</a>
                    <a class="list-group-item list-group-item-action" href="#">Forums</a>
                    <a class="list-group-item list-group-item-action" href="#">News Items</a>
                    <a class="list-group-item list-group-item-action active" href="#" aria-current="page">Announcements</a>
                    <a class="list-group-item list-group-item-action" href="#">Security</a>
                </div>
            </nav>

            <main class="col-md-9">
                <nav aria-label="Breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item"><a href="#">Announcements</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Add announcement</li>
                    </ol>
                </nav>

                <h1>Add announcement</h1>
                <p class="text-secondary">Create a new announcement for EduMax members.</p>

                <form method="post" action="https://students.open.ac.uk/mct/tm252/reflect/reflect.php">
                    <input type="hidden" name="item_ID" value="30001000-5000-654321fedcba">

                    <div class="mb-3">
                        <label for="announcement_title" class="form-label">Announcement title</label>
                        <input type="text" class="form-control" id="announcement_title" name="announcement_title" value="Welcome to the new study term">
                    </div>

                    <div class="mb-3">
                        <label for="announcement_message" class="form-label">Announcement message</label>
                        <textarea class="form-control" id="announcement_message" name="announcement_message" rows="6">Welcome to EduMax. Please check your module pages for new learning activities and updates.</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="publish_date" class="form-label">Publish date</label>
                        <input type="date" class="form-control" id="publish_date" name="publish_date" value="2026-09-14">
                    </div>

                    <button type="submit" class="btn btn-primary">Save announcement</button>
                </form>
            </main>
        </div>
    </div>
</body>
</html>
